[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "useful-mcp-server"
version = "0.1.0"
description = "A FastMCP server for weather, web search, and news"
requires-python = ">=3.11"
dependencies = [
  "fastmcp>=4,<5",
  "fastapi>=0.115,<1",
  "httpx>=0.27,<1",
  "itsdangerous>=2,<3",
  "openai>=2,<3",
  "pydantic>=2,<3",
  "python-dotenv>=1,<2",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-asyncio>=0.23,<2"]

[project.scripts]
useful-mcp-server = "useful_mcp.server:main"
useful-chatbot = "useful_mcp.chatbot:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
useful_mcp = ["web/*.html", "web/*.css", "web/*.js"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

